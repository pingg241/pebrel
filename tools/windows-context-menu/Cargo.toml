[package]
name = "pebrel_context_menu"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-or-later"

# Explorer COM hosting has a separate lifecycle from the desktop application.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "=0.58.0", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
] }
windows-core = "=0.58.0"

[profile.release]
opt-level = "s"
lto = true
panic = "abort"
strip = true
